services:
  - type: web
    name: nifty-paper
    runtime: python
    plan: free
    buildCommand: "echo no dependencies"
    startCommand: python -m nifty_live.live_run --config my_real_config.json --dashboard
    envVars:
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
