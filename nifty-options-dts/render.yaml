services:
  - type: web
    name: nifty-paper
    runtime: python
    plan: free
    rootDir: nifty-options-dts
    buildCommand: "echo no dependencies"
    startCommand: python -m nifty_live.serve --config my_real_config.json
    envVars:
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
